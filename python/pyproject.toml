[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excelreader"
version = "0.1.0"
description = "Read XLSX, XLSB, XLS and CSV through the ExcelReader NativeAOT library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gabriel Matte" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/GabrielMarquezMatte/ExcelReader"

[tool.hatch.build.targets.wheel]
packages = ["src/excelreader"]
# .gitkeep only exists so the gitignored _lib/ directory survives a fresh clone;
# force-include below adds the real native library from the same path, so without
# this exclude hatchling would include _lib twice and refuse to build.
exclude = ["src/excelreader/_lib"]

[tool.hatch.build.targets.wheel.force-include]
"src/excelreader/_lib" = "excelreader/_lib"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

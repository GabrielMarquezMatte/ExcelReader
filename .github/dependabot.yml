version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      analyzers:
        patterns:
          - "*Analyzer*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
      benchmarks:
        patterns:
          - "BenchmarkDotNet"
          - "OfficeIMO.*"
          - "Sep"
          - "SpreadCheetah"
          - "Sylvan.*"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: "/rust"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

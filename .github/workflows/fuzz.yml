name: Fuzz

on:
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: '600'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libfuzzer:
    name: libFuzzer (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [xlsx, xlsx-memory, xlsx-differential, xlsb, xlsb-memory, xlsb-differential, xls, encrypted, csv, csv-sniff, csv-parallel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpFuzz CLI
        run: dotnet tool install --global SharpFuzz.CommandLine

      - name: Build libfuzzer-dotnet
        run: |
          wget -q https://raw.githubusercontent.com/Metalnem/libfuzzer-dotnet/master/libfuzzer-dotnet.cc
          clang -fsanitize=fuzzer libfuzzer-dotnet.cc -o libfuzzer-dotnet
          chmod +x libfuzzer-dotnet

      - name: Publish harness
        run: |
          dotnet publish tests/ExcelReader.Fuzz/ExcelReader.Fuzz.csproj -c Release -o fuzz-out
          chmod +x fuzz-out/ExcelReader.Fuzz

      - name: Generate seed corpus
        run: |
          dotnet fuzz-out/ExcelReader.Fuzz.dll seeds corpus
          # Excel-authored files make far better seeds than anything we can synthesise.
          for d in corpus/xlsx corpus/xlsx-memory; do
            cp RealExcel.xlsx "$d/" 2>/dev/null || true
            cp tests/ExcelReader.Tests/data/*.xlsx "$d/" 2>/dev/null || true
          done
          cp RealExcel.xlsb corpus/xlsb/ 2>/dev/null || true
          cp RealExcel.xlsb corpus/xlsb-memory/ 2>/dev/null || true
          # Inputs that previously crashed a target: keeping them in the corpus guards those paths.
          # Each is named for the target it reproduced on, so it goes to that target's corpus only.
          cp tests/ExcelReader.Fuzz/corpus/xlsx-*.bin corpus/xlsx/ 2>/dev/null || true
          cp tests/ExcelReader.Fuzz/corpus/xlsx-*.bin corpus/xlsx-memory/ 2>/dev/null || true
          cp tests/ExcelReader.Fuzz/corpus/xls-*.bin corpus/xls/ 2>/dev/null || true
          cp tests/ExcelReader.Fuzz/corpus/encrypted-*.bin corpus/encrypted/ 2>/dev/null || true
          ls -la "corpus/${{ matrix.target }}"

      - name: Instrument ExcelReader.Core
        run: sharpfuzz fuzz-out/ExcelReader.Core.dll

      - name: Fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          case "${{ matrix.target }}" in
            xlsx*)     dict=xlsx ;;
            xlsb*)     dict=xlsb ;;
            xls)       dict=xls ;;
            encrypted) dict=encrypted ;;
            csv*)      dict=csv ;;
          esac
          ./libfuzzer-dotnet \
            --target_path=fuzz-out/ExcelReader.Fuzz \
            corpus/${{ matrix.target }} \
            -dict="tests/ExcelReader.Fuzz/dictionaries/$dict.dict" \
            -max_total_time=${{ github.event.inputs.seconds || '600' }} \
            -max_len=131072 \
            -timeout=25 \
            -rss_limit_mb=2048 \
            -print_final_stats=1 \
            -artifact_prefix=crash-

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  check:
    name: Harness smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/ExcelReader.Fuzz/ExcelReader.Fuzz.csproj -c Release

      - name: Generate corpus
        run: |
          mkdir -p corpus/real
          dotnet run --project tests/ExcelReader.Fuzz -c Release --no-build -- seeds corpus
          cp RealExcel.xlsb RealExcel.xlsx corpus/real/ 2>/dev/null || true
          cp tests/ExcelReader.Tests/data/*.xlsx corpus/real/ 2>/dev/null || true
          cp tests/ExcelReader.Fuzz/corpus/* corpus/real/ 2>/dev/null || true

      - name: Run every target over mutated corpus
        run: dotnet run --project tests/ExcelReader.Fuzz -c Release --no-build -- check corpus 200 1

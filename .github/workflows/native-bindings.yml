name: Native bindings

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            native:
              - 'src/ExcelReader.Native/**'
              - 'src/ExcelReader.Core/**'
              - 'global.json'
              - 'python/scripts/build_native.py'
              - '.github/workflows/native-bindings.yml'
            rust:
              - 'rust/**'
            python:
              - 'python/**'
              - 'tests/ExcelReader.NativeSmoke/**'
            cpp:
              - 'cpp/**'

  build-native:
    name: Build native library (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the native library
        shell: bash
        # TEMPORARY: keep symbols so the crash-dump diagnostic can name native frames.
        env:
          StripSymbols: 'false'
        run: python python/scripts/build_native.py

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib/*
          if-no-files-found: error

  test-rust:
    name: Rust crate (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Verify the .def copy matches the canonical one
        shell: bash
        run: diff src/ExcelReader.Native/include/excelreader.def rust/excelreader/excelreader.def

      - name: Locate published native library directory
        id: lib
        shell: bash
        run: echo "dir=python/src/excelreader/_lib" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: cargo clippy
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo test --workspace --all-features --verbose

      # TEMPORARY: the crash dumps point at several threads entering the runtime at once. Loop the
      # suite one test thread at a time: if that is clean where the parallel loop crashes within a
      # few iterations, first-call concurrency is the trigger. Remove once answered.
      - name: "Diagnostic: 15 serial runs of the Rust suite"
        if: always() && runner.os != 'Windows'
        working-directory: rust
        shell: bash
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
          LIBC_FATAL_STDERR_: '1'
        run: |
          set +e
          cargo test --workspace --all-features --no-run -q 2>/dev/null
          crashed=0
          for i in $(seq 1 15); do
            out=$(cargo test --workspace --all-features -- --test-threads=1 2>&1)
            if echo "$out" | grep -q "signal: "; then
              echo "=== crashed on iteration $i ==="
              echo "$out" | grep -B 20 "signal: " | grep -v "^\s*$" | tail -n 25
              crashed=1
              break
            fi
            echo "iteration $i: ok"
          done
          echo "serial-crashed=$crashed"
          exit 0

      - name: cargo build (default features)
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo build --workspace --verbose

      - name: cargo bench (smoke)
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo bench --benches -- --test

  # TEMPORARY: a standalone repro for the runtime crash our Rust tests hit, with none of this
  # project's code in it - a NativeAOT shared library whose exports several threads call for the
  # first time at once. Also tells us whether a newer 10.0.x SDK already fixes it. Remove once
  # answered; if it crashes, it is what goes upstream.
  repro-concurrent-entry:
    name: "Repro: concurrent first calls (${{ matrix.os }}, SDK ${{ matrix.sdk }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['10.0.100', '10.0.x']

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Write the repro
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repro"
          cd "$RUNNER_TEMP/repro"
          cat > repro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <PublishAot>true</PublishAot>
              <NativeLib>Shared</NativeLib>
              <InvariantGlobalization>true</InvariantGlobalization>
              <StackTraceSupport>false</StackTraceSupport>
              <UseSystemResourceKeys>true</UseSystemResourceKeys>
            </PropertyGroup>
          </Project>
          EOF
          cat > Exports.cs <<'EOF'
          using System;
          using System.Buffers;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class Exports
          {
              [UnmanagedCallersOnly(EntryPoint = "work")]
              public static int Work(int n)
              {
                  try
                  {
                      StringBuilder builder = new();
                      for (int i = 0; i < n; i++)
                      {
                          builder.Append(i);
                      }
                      byte[] buffer = ArrayPool<byte>.Shared.Rent(64 * 1024);
                      ArrayPool<byte>.Shared.Return(buffer);
                      return builder.Length;
                  }
                  catch (Exception exception)
                  {
                      Console.Error.WriteLine(exception.Message);
                      return -1;
                  }
              }
          }
          EOF
          cat > host.c <<'EOF'
          // Mirrors what a Rust test binary does: threads with 2 MiB stacks (Rust's default), each
          // making its first call into a linked NativeAOT shared library at the same moment.
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>

          extern int work(int n);

          static void *run(void *arg)
          {
              (void)arg;
              if (work(4000) < 0)
              {
                  fprintf(stderr, "work reported failure\n");
                  exit(2);
              }
              return NULL;
          }

          int main(void)
          {
              enum { THREADS = 8 };
              pthread_attr_t attr;
              pthread_attr_init(&attr);
              pthread_attr_setstacksize(&attr, 2 * 1024 * 1024);
              pthread_t threads[THREADS];
              for (int i = 0; i < THREADS; i++)
              {
                  if (pthread_create(&threads[i], &attr, run, NULL) != 0)
                  {
                      return 3;
                  }
              }
              for (int i = 0; i < THREADS; i++)
              {
                  pthread_join(threads[i], NULL);
              }
              return 0;
          }
          EOF

      - name: Build
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repro"
          dotnet --version
          case "$RUNNER_OS" in
            Linux) rid=linux-x64;  ext=so ;;
            *)     rid=osx-arm64;  ext=dylib ;;
          esac
          dotnet publish -c Release -r $rid | tail -n 3
          lib=$(find bin -name "repro.$ext" | head -n 1)
          echo "lib=$lib"
          cc -O2 host.c "$lib" -o host -Wl,-rpath,"$(cd "$(dirname "$lib")" && pwd)" -lpthread

      - name: Run it 50 times
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/repro"
          ulimit -c unlimited
          [ "$RUNNER_OS" = Linux ] && sudo sysctl -qw kernel.core_pattern=/tmp/core.%p
          crashes=0
          for i in $(seq 1 50); do
            ./host
            status=$?
            if [ $status -ne 0 ]; then
              crashes=$((crashes + 1))
              echo "iteration $i: exit $status$([ $status -gt 128 ] && echo " (signal $((status - 128)))")"
            fi
          done
          echo "=== $crashes crashes in 50 runs ==="
          if [ "$RUNNER_OS" = Linux ] && [ $crashes -gt 0 ]; then
            command -v gdb >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb; } >/dev/null 2>&1
            for c in /tmp/core.*; do
              [ -f "$c" ] || break
              gdb -batch -ex "bt 40" -ex "thread apply all bt 25" ./host "$c" 2>&1 | head -n 300
              break
            done
          elif [ $crashes -gt 0 ]; then
            f=$(ls -t ~/Library/Logs/DiagnosticReports/host-*.ips 2>/dev/null | head -n 1)
            [ -n "$f" ] && head -c 60000 "$f"
          fi
          exit 0

  test-python:
    name: Native + Python + C smoke (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Install the Python package
        run: pip install -e "python[dev]"

      - name: Run the Python tests
        run: pytest python/tests -v

      - name: Build the C smoke test
        run: |
          cmake -S tests/ExcelReader.NativeSmoke -B build/nativesmoke -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nativesmoke --config Release

      - name: Run the C smoke test
        run: ctest --test-dir build/nativesmoke --output-on-failure -C Release

      - name: Run the Python benchmarks (smoke)
        run: |
          python python/benchmarks/bench_read.py --n 1
          python python/benchmarks/bench_write.py --n 1

  test-cpp:
    name: C++ package + smoke test (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: |
          git config core.symlinks true
          git checkout -- cpp/include

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate published native library
        id: lib
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.dll" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.dylib" >> "$GITHUB_OUTPUT" ;;
            *)       echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.so" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure
        env:
          EXCELREADER_NATIVE_LIB: ${{ steps.lib.outputs.path }}
        run: cmake -S cpp -B build/cpp -DEXCELREADER_BUILD_TESTS=ON -DEXCELREADER_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cpp --config Release

      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure -C Release

      - name: Run the C++ benchmarks (smoke)
        shell: bash
        run: |
          for name in excelreader_cpp_benchmarks excelreader_cpp_write_benchmarks; do
            # A multi-config generator (Visual Studio on the Windows runner) nests the binary under a
            # per-configuration directory; the single-config ones do not.
            exe=$(find build/cpp/benchmarks -type f \( -name "$name" -o -name "$name.exe" \) | head -n 1)
            if [ -z "$exe" ]; then
              echo "benchmark binary $name not found under build/cpp/benchmarks" >&2
              exit 1
            fi
            "$exe" --benchmark_min_time=1x
          done

      - name: Install the package
        run: cmake --install build/cpp --config Release --prefix "${{ github.workspace }}/build/prefix"

      - name: Build a find_package() consumer against the install prefix
        shell: bash
        run: |
          cmake -S cpp/tests/package -B build/consumer -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/prefix" \
            -DEXCELREADER_FIXTURE="${{ github.workspace }}/RealExcel.xlsx"
          cmake --build build/consumer --config Release

      - name: Run the consumer
        run: ctest --test-dir build/consumer --output-on-failure -C Release

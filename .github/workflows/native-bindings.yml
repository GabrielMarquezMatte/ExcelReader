name: Native bindings

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            native:
              - 'src/ExcelReader.Native/**'
              - 'src/ExcelReader.Core/**'
              - 'global.json'
              - 'python/scripts/build_native.py'
              - '.github/workflows/native-bindings.yml'
            rust:
              - 'rust/**'
            python:
              - 'python/**'
              - 'tests/ExcelReader.NativeSmoke/**'
            cpp:
              - 'cpp/**'

  build-native:
    name: Build native library (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the native library
        shell: bash
        # TEMPORARY: keep symbols so the crash-dump diagnostic can name native frames.
        env:
          StripSymbols: 'false'
        run: python python/scripts/build_native.py

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib/*
          if-no-files-found: error

  test-rust:
    name: Rust crate (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Verify the .def copy matches the canonical one
        shell: bash
        run: diff src/ExcelReader.Native/include/excelreader.def rust/excelreader/excelreader.def

      - name: Locate published native library directory
        id: lib
        shell: bash
        run: echo "dir=python/src/excelreader/_lib" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: cargo clippy
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo test --workspace --all-features --verbose

      - name: cargo build (default features)
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo build --workspace --verbose

      - name: cargo bench (smoke)
        working-directory: rust
        env:
          EXCELREADER_NATIVE_LIB_DIR: ${{ github.workspace }}/${{ steps.lib.outputs.dir }}
        run: cargo bench --benches -- --test

  # TEMPORARY: a standalone repro for the runtime crash our Rust tests hit, with none of this
  # project's code in it - a NativeAOT shared library whose exports several threads call for the
  # first time at once. Also tells us whether a newer 10.0.x SDK already fixes it. Remove once
  # answered; if it crashes, it is what goes upstream.
  repro-concurrent-entry:
    name: "Repro: concurrent first calls (${{ matrix.os }}, SDK ${{ matrix.sdk }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ['10.0.100', '10.0.x']

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Write the repro
        shell: bash
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          mkdir -p "$RUNNER_TEMP/repro"
          cd "$RUNNER_TEMP/repro"
          # The repro lives outside the repo, so nothing pins the SDK here unless we say so.
          if [ "$SDK" != "10.0.x" ]; then
            printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$SDK" > global.json
          fi
          cat > repro.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <PublishAot>true</PublishAot>
              <NativeLib>Shared</NativeLib>
              <InvariantGlobalization>true</InvariantGlobalization>
              <StackTraceSupport>false</StackTraceSupport>
              <UseSystemResourceKeys>true</UseSystemResourceKeys>
            </PropertyGroup>
          </Project>
          EOF
          cat > Exports.cs <<'EOF'
          using System;
          using System.Buffers;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Threading.Tasks;

          public static class Exports
          {
              // What a Rust test thread's first call runs into: class construction plus allocation.
              [UnmanagedCallersOnly(EntryPoint = "work")]
              public static int Work(int n)
              {
                  try
                  {
                      StringBuilder builder = new();
                      for (int i = 0; i < n; i++)
                      {
                          builder.Append(i);
                      }
                      byte[] buffer = ArrayPool<byte>.Shared.Rent(64 * 1024);
                      ArrayPool<byte>.Shared.Return(buffer);
                      return builder.Length;
                  }
                  catch (Exception exception)
                  {
                      Console.Error.WriteLine(exception.Message);
                      return -1;
                  }
              }

              // What xl_csv_aggregate_* runs: the call blocks on a fan-out across thread pool
              // workers that allocate enough to collect, which is where macOS crashes.
              [UnmanagedCallersOnly(EntryPoint = "fanout")]
              public static int Fanout(int workers, int perWorker)
              {
                  try
                  {
                      Task<int>[] tasks = new Task<int>[workers];
                      for (int w = 0; w < workers; w++)
                      {
                          tasks[w] = Task.Run(() =>
                          {
                              int total = 0;
                              for (int i = 0; i < perWorker; i++)
                              {
                                  byte[] chunk = new byte[1024];
                                  total += chunk.Length;
                                  StringBuilder builder = new();
                                  builder.Append(i);
                                  total += builder.Length;
                              }
                              return total;
                          });
                      }
                      Task.WhenAll(tasks).GetAwaiter().GetResult();
                      int sum = 0;
                      foreach (Task<int> task in tasks)
                      {
                          sum += task.Result;
                      }
                      return sum;
                  }
                  catch (Exception exception)
                  {
                      Console.Error.WriteLine(exception.Message);
                      return -1;
                  }
              }
          }
          EOF
          cat > host.c <<'EOF'
          // Mirrors a Rust test binary: every call into the linked NativeAOT shared library comes
          // from a spawned thread with Rust's default 2 MiB stack, never from the main thread.
          //   argv[1] = concurrent : 8 threads make their first call at the same moment (Linux)
          //   argv[1] = fanout     : one thread calls an export that fans out across the thread pool (macOS)
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          extern int work(int n);
          extern int fanout(int workers, int per_worker);

          static void *run_work(void *arg)
          {
              (void)arg;
              if (work(4000) < 0)
              {
                  fprintf(stderr, "work reported failure\n");
                  exit(2);
              }
              return NULL;
          }

          static void *run_fanout(void *arg)
          {
              (void)arg;
              for (int i = 0; i < 3; i++)
              {
                  if (fanout(8, 4000) < 0)
                  {
                      fprintf(stderr, "fanout reported failure\n");
                      exit(2);
                  }
              }
              return NULL;
          }

          int main(int argc, char **argv)
          {
              int concurrent = argc > 1 && strcmp(argv[1], "concurrent") == 0;
              int count = concurrent ? 8 : 1;
              pthread_attr_t attr;
              pthread_attr_init(&attr);
              pthread_attr_setstacksize(&attr, 2 * 1024 * 1024);
              pthread_t threads[8];
              for (int i = 0; i < count; i++)
              {
                  if (pthread_create(&threads[i], &attr, concurrent ? run_work : run_fanout, NULL) != 0)
                  {
                      return 3;
                  }
              }
              for (int i = 0; i < count; i++)
              {
                  pthread_join(threads[i], NULL);
              }
              return 0;
          }
          EOF

      - name: Build
        shell: bash
        run: |
          cd "$RUNNER_TEMP/repro"
          dotnet --version
          case "$RUNNER_OS" in
            Linux) rid=linux-x64;  ext=so ;;
            *)     rid=osx-arm64;  ext=dylib ;;
          esac
          dotnet publish -c Release -r $rid | tail -n 3
          lib=$(find bin -name "repro.$ext" | head -n 1)
          echo "lib=$lib"
          cc -O2 host.c "$lib" -o host -Wl,-rpath,"$(cd "$(dirname "$lib")" && pwd)" -lpthread

      - name: Run both shapes 50 times each
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/repro"
          ulimit -c unlimited
          [ "$RUNNER_OS" = Linux ] && sudo sysctl -qw kernel.core_pattern=/tmp/core.%p
          crashes=0
          for mode in concurrent fanout; do
            modecrashes=0
            for i in $(seq 1 50); do
              ./host $mode
              status=$?
              if [ $status -ne 0 ]; then
                modecrashes=$((modecrashes + 1))
                echo "$mode iteration $i: exit $status$([ $status -gt 128 ] && echo " (signal $((status - 128)))")"
              fi
            done
            echo "=== $mode: $modecrashes crashes in 50 runs ==="
            crashes=$((crashes + modecrashes))
          done
          if [ "$RUNNER_OS" = Linux ] && [ $crashes -gt 0 ]; then
            command -v gdb >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb; } >/dev/null 2>&1
            for c in /tmp/core.*; do
              [ -f "$c" ] || break
              gdb -batch -ex "bt 40" -ex "thread apply all bt 25" ./host "$c" 2>&1 | head -n 300
              break
            done
          elif [ $crashes -gt 0 ]; then
            f=$(ls -t ~/Library/Logs/DiagnosticReports/host-*.ips 2>/dev/null | head -n 1)
            [ -n "$f" ] && head -c 60000 "$f"
          fi
          exit 0

  # TEMPORARY: the synthetic repro above stays clean, so drive THIS library from a plain C host in
  # the two shapes that crash under Rust. Tells us whether Rust is needed at all, and whether the
  # macOS crash needs a spawned (smaller-stack) calling thread - the C smoke test, which passes,
  # only ever calls from the main thread. Remove once answered.
  repro-c-host:
    name: "Repro: C host, this library (${{ matrix.os }})"
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: lib

      - name: Build the host
        shell: bash
        run: |
          chmod +x lib/*
          cat > host.c <<'EOF'
          // Drives ExcelReader.Native the way the Rust tests do, from plain C.
          //   concurrent  : 8 spawned threads open a workbook for the first time at once
          //   fanout      : one spawned thread runs a degree_of_parallelism=8 CSV aggregation
          //   fanout-main : the same aggregation on the main thread (the C smoke test's shape)
          #include <dlfcn.h>
          #include <pthread.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          typedef struct { int32_t struct_size; int32_t degree_of_parallelism; int32_t header_row;
                           int32_t delimiter; int32_t quote; int32_t detect_bom; int32_t max_cell_bytes; } xl_csv_parallel_options;
          typedef struct { int32_t column; int32_t type; int32_t value_len; const uint8_t *value; } xl_row_cell;
          typedef struct { int32_t cell_count; xl_row_cell *cells; } xl_row;
          typedef struct { int32_t struct_size;
                           int32_t (*seed)(void **, void *);
                           int32_t (*accumulate)(void *, const xl_row *, void *);
                           int32_t (*combine)(void *, void *, void *);
                           void (*free_state)(void *, void *);
                           void *user_data; } xl_csv_aggregation;

          static int32_t (*xl_open_file_ex)(const uint8_t *, int32_t, int32_t, const void *, void **);
          static int32_t (*xl_close)(void *);
          static int32_t (*xl_sheet_count)(void *, int32_t *);
          static int32_t (*xl_csv_aggregate_memory)(const uint8_t *, int32_t, const xl_csv_aggregation *,
                                                    const xl_csv_parallel_options *, void **);

          static const char *workbook_path;
          static uint8_t *csv_data;
          static int32_t csv_len;

          static int32_t seed(void **out_state, void *user_data)
          {
              (void)user_data;
              *out_state = calloc(1, sizeof(int64_t));
              return *out_state ? 0 : -1;
          }

          static int32_t accumulate(void *state, const xl_row *row, void *user_data)
          {
              (void)user_data;
              *(int64_t *)state += row->cell_count;
              return 0;
          }

          static int32_t combine(void *acc, void *next, void *user_data)
          {
              (void)user_data;
              *(int64_t *)acc += *(int64_t *)next;
              return 0;
          }

          static void free_state(void *state, void *user_data)
          {
              (void)user_data;
              free(state);
          }

          static void *open_once(void *arg)
          {
              (void)arg;
              void *workbook = NULL;
              int32_t status = xl_open_file_ex((const uint8_t *)workbook_path, (int32_t)strlen(workbook_path), 0, NULL, &workbook);
              if (status != 0)
              {
                  fprintf(stderr, "open failed: %d\n", status);
                  exit(2);
              }
              int32_t sheets = 0;
              xl_sheet_count(workbook, &sheets);
              xl_close(workbook);
              return NULL;
          }

          static void *aggregate_once(void *arg)
          {
              (void)arg;
              xl_csv_aggregation agg;
              memset(&agg, 0, sizeof(agg));
              agg.struct_size = (int32_t)sizeof(agg);
              agg.seed = seed;
              agg.accumulate = accumulate;
              agg.combine = combine;
              agg.free_state = free_state;

              xl_csv_parallel_options options;
              memset(&options, 0, sizeof(options));
              options.struct_size = (int32_t)sizeof(options);
              options.degree_of_parallelism = 8;
              options.header_row = 1;

              void *state = NULL;
              int32_t status = xl_csv_aggregate_memory(csv_data, csv_len, &agg, &options, &state);
              if (status != 0)
              {
                  fprintf(stderr, "aggregate failed: %d\n", status);
                  exit(2);
              }
              free(state);
              return NULL;
          }

          static void build_csv(void)
          {
              size_t capacity = 8u * 1024 * 1024;
              csv_data = malloc(capacity);
              int written = snprintf((char *)csv_data, capacity, "group,amount\n");
              for (int i = 0; i < 300000; i++)
              {
                  written += snprintf((char *)csv_data + written, capacity - written, "%s,%d\n",
                                      (i % 3 == 0) ? "alpha" : ((i % 3 == 1) ? "beta" : "gamma"), i);
              }
              csv_len = written;
          }

          int main(int argc, char **argv)
          {
              const char *mode = argc > 1 ? argv[1] : "concurrent";
              const char *lib_path = argv[2];
              workbook_path = argv[3];

              void *lib = dlopen(lib_path, RTLD_NOW);
              if (!lib)
              {
                  fprintf(stderr, "dlopen: %s\n", dlerror());
                  return 3;
              }
              xl_open_file_ex = dlsym(lib, "xl_open_file_ex");
              xl_close = dlsym(lib, "xl_close");
              xl_sheet_count = dlsym(lib, "xl_sheet_count");
              xl_csv_aggregate_memory = dlsym(lib, "xl_csv_aggregate_memory");
              if (!xl_open_file_ex || !xl_close || !xl_sheet_count || !xl_csv_aggregate_memory)
              {
                  fprintf(stderr, "missing export\n");
                  return 3;
              }

              if (strcmp(mode, "concurrent") == 0)
              {
                  pthread_attr_t attr;
                  pthread_attr_init(&attr);
                  pthread_attr_setstacksize(&attr, 2 * 1024 * 1024);
                  pthread_t threads[8];
                  for (int i = 0; i < 8; i++)
                  {
                      if (pthread_create(&threads[i], &attr, open_once, NULL) != 0)
                      {
                          return 3;
                      }
                  }
                  for (int i = 0; i < 8; i++)
                  {
                      pthread_join(threads[i], NULL);
                  }
                  return 0;
              }

              build_csv();
              if (strcmp(mode, "fanout-main") == 0)
              {
                  aggregate_once(NULL);
                  aggregate_once(NULL);
                  return 0;
              }

              pthread_attr_t attr;
              pthread_attr_init(&attr);
              pthread_attr_setstacksize(&attr, 2 * 1024 * 1024);
              pthread_t thread;
              if (pthread_create(&thread, &attr, aggregate_once, NULL) != 0)
              {
                  return 3;
              }
              pthread_join(thread, NULL);
              return 0;
          }
          EOF
          cc -O2 host.c -o host -ldl -lpthread 2>/dev/null || cc -O2 host.c -o host -lpthread

      - name: Run each shape 40 times
        shell: bash
        run: |
          set +e
          case "$RUNNER_OS" in
            Linux) lib=lib/ExcelReader.Native.so ;;
            *)     lib=lib/ExcelReader.Native.dylib ;;
          esac
          for mode in concurrent fanout fanout-main; do
            crashes=0
            for i in $(seq 1 40); do
              ./host $mode "$PWD/$lib" "$PWD/RealExcel.xlsx"
              status=$?
              if [ $status -gt 128 ]; then
                crashes=$((crashes + 1))
                echo "$mode iteration $i: signal $((status - 128))"
              elif [ $status -ne 0 ]; then
                echo "$mode iteration $i: exit $status"
              fi
            done
            echo "=== $mode: $crashes crashes in 40 runs ==="
          done
          exit 0

  test-python:
    name: Native + Python + C smoke (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Install the Python package
        run: pip install -e "python[dev]"

      - name: Run the Python tests
        run: pytest python/tests -v

      - name: Build the C smoke test
        run: |
          cmake -S tests/ExcelReader.NativeSmoke -B build/nativesmoke -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nativesmoke --config Release

      - name: Run the C smoke test
        run: ctest --test-dir build/nativesmoke --output-on-failure -C Release

      - name: Run the Python benchmarks (smoke)
        run: |
          python python/benchmarks/bench_read.py --n 1
          python python/benchmarks/bench_write.py --n 1

  test-cpp:
    name: C++ package + smoke test (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: |
          git config core.symlinks true
          git checkout -- cpp/include

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/excelreader/_lib/*

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate published native library
        id: lib
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.dll" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.dylib" >> "$GITHUB_OUTPUT" ;;
            *)       echo "path=${{ github.workspace }}/python/src/excelreader/_lib/ExcelReader.Native.so" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure
        env:
          EXCELREADER_NATIVE_LIB: ${{ steps.lib.outputs.path }}
        run: cmake -S cpp -B build/cpp -DEXCELREADER_BUILD_TESTS=ON -DEXCELREADER_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cpp --config Release

      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure -C Release

      - name: Run the C++ benchmarks (smoke)
        shell: bash
        run: |
          for name in excelreader_cpp_benchmarks excelreader_cpp_write_benchmarks; do
            # A multi-config generator (Visual Studio on the Windows runner) nests the binary under a
            # per-configuration directory; the single-config ones do not.
            exe=$(find build/cpp/benchmarks -type f \( -name "$name" -o -name "$name.exe" \) | head -n 1)
            if [ -z "$exe" ]; then
              echo "benchmark binary $name not found under build/cpp/benchmarks" >&2
              exit 1
            fi
            "$exe" --benchmark_min_time=1x
          done

      - name: Install the package
        run: cmake --install build/cpp --config Release --prefix "${{ github.workspace }}/build/prefix"

      - name: Build a find_package() consumer against the install prefix
        shell: bash
        run: |
          cmake -S cpp/tests/package -B build/consumer -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/prefix" \
            -DEXCELREADER_FIXTURE="${{ github.workspace }}/RealExcel.xlsx"
          cmake --build build/consumer --config Release

      - name: Run the consumer
        run: ctest --test-dir build/consumer --output-on-failure -C Release

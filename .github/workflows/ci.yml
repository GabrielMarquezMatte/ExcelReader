name: CI

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dotnet == 'true' }}
      aot: ${{ github.event_name != 'pull_request' || steps.filter.outputs.aot == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'docs/snippets/**'
              - 'Directory.Build.props'
              - 'global.json'
              - 'ExcelReader.slnx'
              - '.editorconfig'
              - 'coverage.runsettings'
              - 'RealExcel.*'
              - '.github/workflows/ci.yml'
            aot:
              - 'src/ExcelReader.Core/**'
              - 'src/ExcelReader.Generator/**'
              - 'tests/ExcelReader.AotSanity/**'
              - 'Directory.Build.props'
              - 'global.json'
              - '.github/workflows/ci.yml'
            scripts:
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  test:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUN: ${{ needs.changes.outputs.dotnet }}
      # The whole solution compiles the same on every OS, so Linux builds all of it and the others
      # build only what the tests need.
      BUILD_TARGET: ${{ matrix.os == 'ubuntu-latest' && 'ExcelReader.slnx' || 'tests/ExcelReader.Tests/ExcelReader.Tests.csproj' }}
      # Analyzers are about two thirds of the compile and report the same on every OS, so only the
      # Linux build runs them; every other build in CI skips them. Source generators still run.
      BUILD_ARGS: ${{ matrix.os != 'ubuntu-latest' && '-p:RunAnalyzers=false' || '' }}

    steps:
      - name: Nothing to build
        if: env.RUN != 'true'
        run: echo "No .NET sources changed; skipping build and tests."

      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v7

      - name: Setup .NET
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        if: env.RUN == 'true'
        run: dotnet restore ${{ env.BUILD_TARGET }}

      - name: Build (Release)
        if: env.RUN == 'true'
        run: dotnet build ${{ env.BUILD_TARGET }} --configuration Release --no-restore -p:DeterministicSourcePaths=false ${{ env.BUILD_ARGS }}

      - name: Verify formatting (whitespace)
        if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: dotnet format whitespace ExcelReader.slnx --verify-no-changes

      # Packing runs package validation, which fails on any binary break against the last release.
      - name: Validate packages against the last release
        if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/ExcelReader.Core/ExcelReader.Core.csproj --configuration Release --no-build --output ./package-validation
          dotnet pack src/ExcelReader.Arrow/ExcelReader.Arrow.csproj --configuration Release --no-build --output ./package-validation

      - name: Test (Release)
        if: env.RUN == 'true'
        run: >-
          dotnet test --project tests/ExcelReader.Tests/ExcelReader.Tests.csproj
          --results-directory ./TestResults
          --configuration Release
          --verbosity normal
          --no-build
          --
          --report-xunit-trx
          ${{ matrix.os == 'ubuntu-latest' && '--coverage --coverage-settings coverage.runsettings --coverage-output-format cobertura' || '' }}

      - name: Upload test results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/*.cobertura.xml
          flags: csharp
          fail_ci_if_error: false

  isa-fallback:
    name: Test ISA fallback (${{ matrix.isa }})
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: sse2
            avx2: '0'
            avx512f: '0'
            hwintrinsic: '1'
          - isa: no-simd
            avx2: '1'
            avx512f: '1'
            hwintrinsic: '0'
    env:
      DOTNET_EnableAVX2: ${{ matrix.avx2 }}
      DOTNET_EnableAVX512F: ${{ matrix.avx512f }}
      DOTNET_EnableHWIntrinsic: ${{ matrix.hwintrinsic }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build (Release)
        run: dotnet build tests/ExcelReader.Tests/ExcelReader.Tests.csproj --configuration Release -p:RunAnalyzers=false

      - name: Test (Release)
        run: dotnet test --project tests/ExcelReader.Tests/ExcelReader.Tests.csproj --configuration Release --no-build

  aot-sanity:
    name: AOT/trim sanity (win-x64)
    needs: changes
    if: needs.changes.outputs.aot == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ExcelReader.slnx

      - name: Publish ExcelReader.AotSanity (PublishAot)
        run: dotnet publish tests/ExcelReader.AotSanity/ExcelReader.AotSanity.csproj -c Release -r win-x64

      - name: Run published binary
        run: .\tests\ExcelReader.AotSanity\bin\Release\net10.0\win-x64\publish\ExcelReader.AotSanity.exe

      - name: Pack and verify the generator ships inside the nupkg
        shell: pwsh
        run: |
          dotnet pack src/ExcelReader.Core/ExcelReader.Core.csproj -c Release -o ./artifacts -p:RunAnalyzers=false
          $pkg = Get-ChildItem ./artifacts/*.nupkg | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'analyzers/dotnet/cs/ExcelReader.Generator.dll' }
          } finally {
            $zip.Dispose()
          }
          if (-not $entry) {
            throw "ExcelReader.Generator.dll is missing from analyzers/dotnet/cs in $($pkg.Name) — the generator will not reach consumers of this package."
          }

  scripts:
    name: CI scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test public API scripts
        working-directory: .github/scripts
        run: |
          python3 test_promote_public_api.py -v
          python3 test_add_missing_public_api.py -v

name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

# Nothing is published until every build and test job has passed.
jobs:
  build:
    name: Build, test & pack (.NET)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ExcelReader.slnx

      - name: Build (Release)
        run: dotnet build ExcelReader.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test (Release)
        run: dotnet test --project tests/ExcelReader.Tests/ExcelReader.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          for project in ExcelReader.Core ExcelReader.Cli ExcelReader.Arrow; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-restore \
              -p:Version=${{ steps.version.outputs.value }} --output ./artifacts
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./artifacts
          format: spdx-json
          output-file: ./artifacts/excelreader.spdx.json
          # This job is read-only; the publish job attaches the SBOM once every test has passed.
          upload-release-assets: false

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          if-no-files-found: error

  native:
    name: Build native library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build the native library
        shell: bash
        run: python python/scripts/build_native.py

      - name: Rename asset for this platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) src=ExcelReader.Native.dll;  os=win;   ext=dll ;;
            macOS)   src=ExcelReader.Native.dylib; os=osx;  ext=dylib ;;
            *)       src=ExcelReader.Native.so;   os=linux; ext=so ;;
          esac
          arch=$([ "$(uname -m 2>/dev/null || echo x64)" = "arm64" ] && echo arm64 || echo x64)
          mkdir -p release-assets
          cp "python/src/excelreader/_lib/${src}" "release-assets/excelreader-native-${os}-${arch}.${ext}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload library for the Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib/*
          if-no-files-found: error

  cli:
    name: Build excelreader CLI (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Determine RID
        id: rid
        shell: bash
        run: |
          arch=$([ "$(uname -m 2>/dev/null || echo x64)" = "arm64" ] && echo arm64 || echo x64)
          case "${{ runner.os }}" in
            Windows) os=win ;;
            macOS)   os=osx ;;
            *)       os=linux ;;
          esac
          echo "value=${os}-${arch}" >> "$GITHUB_OUTPUT"

      - name: Publish native AOT binary
        shell: bash
        run: >-
          dotnet publish src/ExcelReader.Cli/ExcelReader.Cli.csproj
          --configuration Release
          -r ${{ steps.rid.outputs.value }}
          -p:PublishAot=true
          -p:PackAsTool=false
          -p:Version=${{ needs.build.outputs.version }}
          --output ./cli-publish

      - name: Rename asset for this platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) src=ExcelReader.Cli.exe; ext=.exe ;;
            *)       src=ExcelReader.Cli;     ext= ;;
          esac
          mkdir -p release-assets
          cp "./cli-publish/${src}" "release-assets/excelreader-${{ steps.rid.outputs.value }}${ext}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  python:
    name: Build Python wheel (${{ matrix.os }})
    needs: [build, native]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download the native library
        uses: actions/download-artifact@v8
        with:
          name: python-lib-${{ matrix.os }}
          path: python/src/excelreader/_lib

      - name: Set package version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ needs.build.outputs.version }}\"/" python/pyproject.toml
          rm -f python/pyproject.toml.bak

      - name: Install test dependencies
        run: pip install -e "python[dev]"

      - name: Test (Python)
        run: pytest python/tests

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel python/ --outdir dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to NuGet & GitHub Release
    needs: [build, native, cli, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            artifacts/*.spdx.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-rust:
    name: Publish Rust crates
    # build.rs downloads the native library from the GitHub Release, so the assets must be up first.
    needs: [build, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set crate versions
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/; s/(excelreader-derive = \{[^}]*version = )\"[^\"]*\"/\1\"${VERSION}\"/" rust/Cargo.toml
          grep -q "^version = \"${VERSION}\"" rust/Cargo.toml || { echo "::error::failed to set the workspace version in rust/Cargo.toml"; exit 1; }
          grep -q "excelreader-derive = {.*version = \"${VERSION}\"" rust/Cargo.toml || { echo "::error::failed to set the excelreader-derive dependency version in rust/Cargo.toml"; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish excelreader-derive to crates.io
        working-directory: rust/excelreader-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Publish excelreader to crates.io
        working-directory: rust/excelreader
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

  promote-public-api:
    name: Promote PublicAPI.Unshipped -> Shipped
    needs: publish
    # A release candidate's API can still change, so only final releases promote it.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Promote unshipped API entries
        id: promote
        run: |
          set +e
          python3 .github/scripts/promote_public_api.py
          code=$?
          set -e
          # Exit 2 means "nothing to promote", a real no-op, not a failure. Any other
          # nonzero code is an actual crash (missing file, permission error, etc.) and must fail
          # the job instead of being silently absorbed into changed=false.
          if [ "$code" -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Open PR
        if: steps.promote.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: promote public API for ${{ github.ref_name }}"
          title: "chore: promote public API for ${{ github.ref_name }}"
          body: >-
            Everything that was in `PublicAPI.Unshipped.txt` when `${{ github.ref_name }}` was
            published is now part of the shipped contract. Moves it into `PublicAPI.Shipped.txt`
            so future removals/signature changes get flagged as breaking.
          branch: chore/promote-public-api-${{ github.ref_name }}
          base: develop
          delete-branch: true
          add-paths: |
            src/*/PublicAPI/PublicAPI.Shipped.txt
            src/*/PublicAPI/PublicAPI.Unshipped.txt

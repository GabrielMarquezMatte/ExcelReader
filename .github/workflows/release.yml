name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ExcelReader.slnx

      - name: Build (Release)
        run: dotnet build ExcelReader.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test (Release)
        run: dotnet test --project tests/ExcelReader.Tests/ExcelReader.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack src/ExcelReader.Core/ExcelReader.Core.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          --output ./artifacts

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./artifacts
          format: spdx-json
          output-file: ./artifacts/excelreader.spdx.json

      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          if-no-files-found: warn

  publish-native-assets:
    name: Publish native binary (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the native library
        shell: bash
        run: python python/scripts/build_native.py

      - name: Rename asset for this platform
        id: asset
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) src=ExcelReader.Native.dll;  os=win;   ext=dll ;;
            macOS)   src=ExcelReader.Native.dylib; os=osx;  ext=dylib ;;
            *)       src=ExcelReader.Native.so;   os=linux; ext=so ;;
          esac
          arch=$([ "$(uname -m 2>/dev/null || echo x64)" = "arm64" ] && echo arm64 || echo x64)
          name="excelreader-native-${os}-${arch}.${ext}"
          cp "python/src/excelreader/_lib/${src}" "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.name }}
          fail_on_unmatched_files: true

  publish-rust:
    name: Publish Rust crate
    needs: publish-native-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set crate version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.value }}\"/" rust/excelreader/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: rust/excelreader
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

  publish-python:
    name: Build Python wheel (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.value }}\"/" python/pyproject.toml
          rm -f python/pyproject.toml.bak

      - name: Build the native library
        run: python python/scripts/build_native.py

      - name: Install test dependencies
        run: pip install -e "python[dev]"

      - name: Test (Python)
        run: pytest python/tests

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel python/ --outdir dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: publish-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.value }}\"/" python/pyproject.toml
          rm -f python/pyproject.toml.bak

      - name: Download wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      # No sdist: this package has no pure-Python fallback path. _lib/ ships only a
      # per-platform native binary that build_native.py produces at build time - a
      # sdist built here would carry an empty _lib/ (just .gitkeep, since the real
      # binary is gitignored) and would install "successfully" while being unusable
      # at import time. Publishing wheels only means an unsupported platform/Python
      # combination fails at install time instead.

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  promote-public-api:
    name: Promote PublicAPI.Unshipped -> Shipped
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Promote unshipped API entries
        id: promote
        run: |
          set +e
          python3 .github/scripts/promote_public_api.py
          code=$?
          set -e
          # Exit 2 means "nothing to promote", a real no-op, not a failure. Any other
          # nonzero code is an actual crash (missing file, permission error, etc.) and must fail
          # the job instead of being silently absorbed into changed=false.
          if [ "$code" -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Open PR
        if: steps.promote.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: promote public API for ${{ github.ref_name }}"
          title: "chore: promote public API for ${{ github.ref_name }}"
          body: >-
            Everything that was in `PublicAPI.Unshipped.txt` when `${{ github.ref_name }}` was
            published is now part of the shipped contract. Moves it into `PublicAPI.Shipped.txt`
            so future removals/signature changes get flagged as breaking.
          branch: chore/promote-public-api-${{ github.ref_name }}
          base: develop
          delete-branch: true
          add-paths: |
            src/*/PublicAPI/*/PublicAPI.Shipped.txt
            src/*/PublicAPI/*/PublicAPI.Unshipped.txt

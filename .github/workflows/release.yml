name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ExcelReader.slnx

      - name: Build (Release)
        run: dotnet build ExcelReader.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test (Release)
        run: dotnet test --project tests/ExcelReader.Tests/ExcelReader.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack src/ExcelReader.Core/ExcelReader.Core.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          --output ./artifacts

      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          if-no-files-found: warn

  promote-public-api:
    name: Promote PublicAPI.Unshipped -> Shipped
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Promote unshipped API entries
        id: promote
        run: |
          if python3 .github/scripts/promote_public_api.py; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.promote.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: promote public API for ${{ github.ref_name }}"
          title: "chore: promote public API for ${{ github.ref_name }}"
          body: >-
            Everything that was in `PublicAPI.Unshipped.txt` when `${{ github.ref_name }}` was
            published is now part of the shipped contract. Moves it into `PublicAPI.Shipped.txt`
            so future removals/signature changes get flagged as breaking.
          branch: chore/promote-public-api-${{ github.ref_name }}
          base: develop
          delete-branch: true
          add-paths: |
            src/*/PublicAPI/*/PublicAPI.Shipped.txt
            src/*/PublicAPI/*/PublicAPI.Unshipped.txt

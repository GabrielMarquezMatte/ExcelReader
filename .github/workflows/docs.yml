name: Docs -> GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/ExcelReader.Core/**'
      - 'src/ExcelReader.Arrow/**'
      - 'src/ExcelReader.Native/include/excelreader.h'
      - 'docs/**'
      - '**.md'
      - 'docfx.json'
      - 'assets/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build site
        run: |
          dotnet tool install --global docfx --version 2.81.0
          docfx docfx.json

      # keep_files leaves dev/bench (benchmark-pages.yml) in place; pages removed from the docs
      # stay on the branch until deleted by hand.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          publish_branch: gh-pages
          keep_files: true

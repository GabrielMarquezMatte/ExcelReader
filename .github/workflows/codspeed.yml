name: CodSpeed Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the CodSpeed harness (Release)
        run: dotnet build tests/ExcelReader.CodSpeed/ExcelReader.CodSpeed.csproj --configuration Release

      # No `run` input: the action then executes the benchmarks declared in codspeed.yml.
      # DOTNET_EnableDiagnostics=0 skips the diagnostics IPC pipe/socket every process opens on
      # startup — setup for a channel nothing reads, but its cost varies with host I/O noise, so
      # it would otherwise leak into a walltime measurement it has nothing to do with.
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
        env:
          DOTNET_EnableDiagnostics: 0

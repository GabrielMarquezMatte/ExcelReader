[package]
name = "excelreader-derive"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Derive macro for excelreader's ExcelMapper trait - depend on excelreader instead, which re-exports this."
repository = "https://github.com/GabrielMarquezMatte/ExcelReader"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

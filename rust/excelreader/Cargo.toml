[package]
name = "excelreader"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Read and write Excel/CSV workbooks via ExcelReader's native ABI (schema-driven typed parse and write)."
repository = "https://github.com/GabrielMarquezMatte/ExcelReader"
readme = "README.md"
build = "build.rs"

[features]
default = []
# NaiveDate/NaiveTime/NaiveDateTime, so `#[derive(ExcelMapper)]` can populate chrono fields
chrono = ["dep:chrono"]
arrow = ["dep:arrow"]

[dependencies]
excelreader-derive = { path = "../excelreader-derive", version = "0.0.0" }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
arrow = { version = "56", optional = true, default-features = false, features = ["ffi"] }

[dev-dependencies]
trybuild = "1"
criterion = "0.5"
calamine = { version = "0.36.1", features = ["chrono"] }
rust_xlsxwriter = "0.98.2"

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "compare_bench"
harness = false

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "alloc_bench"
harness = false

[package.metadata.docs.rs]
all-features = true

coverage:
  status:
    project:
      csharp:
        target: 88%
        flags:
          - csharp
      python:
        target: 88%
        flags:
          - python
      rust:
        target: 88%
        flags:
          - rust
      cpp:
        target: 88%
        flags:
          - cpp
    patch:
      default:
        target: 88%

# gcov reports the C++ headers through the cpp/include/xl symlink; git tracks them at their real path.
fixes:
  - "cpp/include/xl/::src/ExcelReader.Native/include/"

# Each language uploads under its own flag from a path-filtered job, so a flag a commit did not run keeps its last report.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: csharp
      paths:
        - src/
    - name: rust
      paths:
        - rust/
    - name: python
      paths:
        - python/
    - name: cpp
      paths:
        - src/ExcelReader.Native/include/
